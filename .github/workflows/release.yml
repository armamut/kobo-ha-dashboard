name: Release

# Push a tag like v0.2.0 to build every package and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kobo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      # Zig for cargo-zigbuild, checksum-verified (mlugg/setup-zig still runs on Node 20)
      - name: Install Zig
        run: |
          curl -sSfL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - run: cargo install cargo-zigbuild --locked
      - run: cargo test --locked
      - run: cargo zigbuild --locked --release --target armv7-unknown-linux-musleabihf
      - uses: actions/upload-artifact@v7
        with:
          name: kobo-binary
          path: target/armv7-unknown-linux-musleabihf/release/kobo-ha-dashboard

  desktop:
    needs: kobo
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-apple-silicon, exe: "" }
          # Built on Apple silicon for the Intel target (macOS Intel runners are retired)
          - { os: macos-14, target: x86_64-apple-darwin, name: macos-intel, exe: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x64, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: kobo-binary
          path: kobo-binary
      - name: Package
        shell: bash
        run: |
          PKG="kobo-ha-dashboard-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "$PKG/kobo"
          cp "target/${{ matrix.target }}/release/kobo-ha-dashboard${{ matrix.exe }}" "$PKG/"
          cp kobo-binary/kobo-ha-dashboard "$PKG/kobo/kobo-ha-dashboard"
          cp README.md LICENSE config.example.yaml "$PKG/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$PKG.zip" "$PKG" > /dev/null
          else
            chmod +x "$PKG/kobo-ha-dashboard" "$PKG/kobo/kobo-ha-dashboard"
            zip -qr "$PKG.zip" "$PKG"
          fi
          echo "PKG_ZIP=$PKG.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PKG_ZIP }}

  publish:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
