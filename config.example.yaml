# ==============================================================================
# Kobo HA Dashboard - example configuration
#
# The easiest way to create this file is the setup tool: run the
# kobo-ha-dashboard program on your computer and follow the three steps.
# This file documents every option for people who prefer editing YAML.
# ==============================================================================

version: 1

device:
  # Kobo model, used for the setup tool's preview size: clara_colour, clara_bw,
  # libra_colour, elipsa_2e, clara_2e, libra_2, sage, elipsa, clara_hd,
  # libra_h2o, forma, tolino_shine_color, tolino_vision_color, tolino_shine_5
  # or "auto". On the Kobo the real screen resolution is always used.
  model: "auto"

  # "portrait" or "landscape"
  orientation: "portrait"

  # Do a full (flashing) e-ink refresh every N screen updates to clear ghosting.
  # 0 disables it.
  full_refresh_cycles: 10

  fb_device: "/dev/fb0"
  # "auto" finds the touch screen; set a path like /dev/input/event1 to force one
  touch_device: "auto"

  # Raw touch coordinates on Kobo devices have X/Y swapped and X mirrored.
  # The defaults are right for the Clara Colour and most other models.
  swap_touch_xy: true
  invert_touch_x: true
  invert_touch_y: false

  # If the picture comes out rotated or upside down, try 0, 90, 180 or 270.
  fb_rotation: "auto"

  # Which way the device is turned in landscape mode: 90 or 270
  landscape_rotation: 90

  # Use colour e-ink waveforms (Kaleido panels such as the Clara Colour)
  color_panel: true

  # Switch the frontlight off after this many seconds without a tap (0 = never)
  frontlight_timeout_secs: 0

  # Sleep mode: suspend the Kobo after this many seconds without a tap
  # (0 = never). The screen keeps showing the dashboard with a note; the
  # power button wakes it. Never sleeps while plugged in.
  sleep_after_secs: 0
  # While asleep, wake up this often (seconds) to refresh the screen
  sleep_wake_secs: 900
  # The eye button in the top bar keeps the Kobo awake until you tap it again
  # (no sleep, no light auto-off). "auto" shows it where the top bar has room
  # (not on 6" Kobos held upright); "show" or "hide" to choose.
  keep_awake_button: "auto"
  # At or below this battery level (without a charger) show "Battery empty" and
  # sleep until the Kobo is charged. Works without sleep mode too. 0 = never
  battery_critical_percent: 3

home_assistant:
  # An address the Kobo can reach on your Wi-Fi. ".local" (mDNS) names do NOT
  # work on the Kobo - use the IP address of Home Assistant.
  url: "http://192.168.1.10:8123"

  # Profile -> Security -> Long-lived access tokens -> Create token.
  # Leave empty to run with built-in demo data.
  token: ""

  # How often the dashboard updates, in seconds (default 300 = 5 minutes).
  # The screen is redrawn this often with the latest states (pushed changes
  # wait for it, except right after a tap); nothing is drawn in between,
  # which saves battery. Also how often states are polled if live updates
  # are down. Minimum 30.
  update_interval_secs: 300
  timeout_secs: 8

  # Send the Kobo's battery level to Home Assistant as a sensor, for example
  # to switch a smart plug for charging. Needs a token of an admin user. The
  # sensor is gone after a Home Assistant restart until the next report.
  report_battery: false
  battery_entity: "sensor.kobo_battery"

  # Show demo data when no token is set
  demo_mode_fallback: true

theme:
  # "kaleido" (colour), "high_contrast_bw", "paper_warm" or "dark"
  mode: "kaleido"
  # Colour of scene buttons and other accents
  accent_color: "#D97706"
  card_corner_radius: 22.0
  # "24h" or "12h"
  time_format: "24h"
  # Show a clock in the top bar. Off by default: a clock makes the e-ink
  # screen redraw every minute, which costs battery.
  show_clock: false
  # en, tr, de, fr, es, it, nl, pt, pl, ja, zh
  # (ja/zh need an extra font, which the setup tool copies to the Kobo)
  language: "en"
  # The Kobo keeps its system clock in UTC. The setup tool writes your zone into
  # launch.sh as a POSIX TZ rule, which follows daylight saving; set a fixed
  # offset here only to override that, as it is an hour off after a clock change.
  # utc_offset: "+01:00"

# ------------------------------------------------------------------------------
# Pages are shown as tabs. Small cards (light, switch, climate, sensor, scene)
# are placed two per row; weather, scenes_row, sensor_grid and media_player
# always take a full row. A small card without a partner becomes full width.
# ------------------------------------------------------------------------------
pages:
  - id: "home"
    title: "Home"
    icon: "home"
    cards:
      - type: "weather"
        entity_id: "weather.home"
        forecast_days: 5

      # Buttons that run scenes/scripts, press buttons or toggle anything else
      - type: "scenes_row"
        title: "Scenes"
        scenes:
          - entity_id: "scene.good_night"
            title: "Good night"
            icon: "moon"
          - entity_id: "script.movie_time"
            title: "Movie"
            icon: "tv"

      - type: "light"
        entity_id: "light.living_room"
        title: "Ceiling Light"
        subtitle: "Living room"
        # Shows a brightness bar for dimmable lights
        show_brightness: true

      - type: "switch"
        entity_id: "switch.kettle"
        title: "Kettle"
        icon: "coffee"

      - type: "climate"
        entity_id: "climate.living_room"
        title: "Living room"
        # Step of the +/- buttons in degrees
        step: 0.5

      # Up to 4 sensors per row
      - type: "sensor_grid"
        title: "Climate"
        # Bigger values with smaller icons (also for "sensor" cards)
        # large_value: true
        sensors:
          - entity_id: "sensor.living_room_temperature"
            title: "Temperature"
            icon: "thermometer"
            unit: "°C"
          - entity_id: "sensor.living_room_humidity"
            title: "Humidity"
            icon: "droplet"
            unit: "%"

      - type: "media_player"
        entity_id: "media_player.living_room"
        title: "Speaker"

  - id: "energy"
    title: "Energy"
    icon: "zap"
    cards:
      - type: "sensor"
        entity_id: "sensor.energy_today"
        title: "Energy today"
        unit: "kWh"
        icon: "zap"
        # Last 24 hours from Home Assistant's history
        show_graph: true

      - type: "scene"
        entity_id: "script.all_off"
        title: "All off"
        icon: "power"

      # A section title, like Lovelace's heading card
      - type: "heading"
        title: "Energy"
        icon: "zap"

      # Bar chart of Home Assistant's long-term statistics, like Lovelace's
      # statistics-graph. period is "day", "week" or "month"; days is how far
      # back the chart goes; stat is "change" (usage per period), "mean",
      # "min" or "max".
      - type: "statistics"
        entity_id: "sensor.gas_meter_gas"
        title: "Gas per day"
        period: "day"
        days: 14
        stat: "change"
        unit: "m³"

      # A picture from a Home Assistant image entity: a chart or snapshot that
      # Home Assistant renders itself. It is fetched every few hours; while it
      # is missing the card shows "--".
      - type: "image"
        entity_id: "image.energy_prices_today"
        title: "Electricity price today"
        # fit: cover        # contain (whole picture, default), cover (fill, cut at the edges) or stretch
        # frameless: true   # just the picture, without the card around it

      # Other cards:
      # - type: "progress"     # a bar and a percentage, e.g. a 3D print
      #   entity_id: "sensor.printer_percent_complete"
      #   secondary_entity: "sensor.printer_end_time"   # time left or end time
      # - type: "cover"        # open / stop / close and the position
      #   entity_id: "cover.living_room"
      # - type: "glance"       # many entities in a row
      #   entities:
      #     - { entity_id: "binary_sensor.front_door", title: "Door" }
      # - type: "statistics"
      #   chart: "line"        # bar (default), hbar or line
      #   period: "hour"       # 5minute, hour, day, week or month
      #   hours: 24            # a range in hours instead of days
      # - type: "image"
      #   entity_id: "camera.garden"   # a camera snapshot, every 10 minutes
      # - type: "image"
      #   entity_id: ""
      #   file: "family.png"   # a picture of your own, in pictures/ next to this file
      # - type: "breakdown"    # how a total splits, as a ring
      #   entities:
      #     - { entity_id: "sensor.washer_power", title: "Washer" }
      #     - { entity_id: "sensor.oven_power", title: "Oven" }
      # - type: "climate"
      #   entity_id: "climate.living_room"
      #   show_graph: true     # room and target temperature, and when it heated
      #   graph_hours: 24

# Available icons: lightbulb, lightbulb_on, lamp, power, plug, fan, thermometer,
# flame, radiator, snowflake, droplet, wind, zap, sun, moon, cloud, leaf, plant,
# home, sofa, bed, door, window, blinds, garage, lock, key, shield, bell, camera,
# person, motion, car, ev_charger, solar, gauge, chart, tv, music, coffee,
