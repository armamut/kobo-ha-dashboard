install:
  title: "Kobo'nuza kurun"
  step1: "Panel, Kobo için küçük bir menü eklentisi olan <b>NickelMenu</b> üzerinden başlatılır. Kobo'nuzda yoksa kurulum aracı aşağıda sizin için kurar."
  step2: "Kobo'yu USB ile bağlayın ve ekranındaki <b>Bağlan</b>'a dokunun."
  step3: "Aşağıdaki <b>Kur</b> butonuna basın, ardından Kobo'yu çıkarıp yeniden başlatın."
  step4: "Kobo ana ekranının sağ altındaki menüyü açın ve panelinizi seçin."
  menu_name: "Kobo menüsündeki adı"
