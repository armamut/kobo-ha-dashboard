// ---------- Step 2 ----------
/// The add panel: one item per card type. Dragged onto the page it lands
/// where it is dropped, at the size a new card of that type has; a click
/// puts it in the first free spot.
/// The add panel's groups, in order. A camera is a picture card with a
/// camera entity.
const PALETTE = [
  ["ws.group_page", ["heading", "weather"]],
  ["ws.group_controls", ["light", "switch", "climate", "cover", "media_player", "scene", "scenes_row"]],
  ["ws.group_values", ["sensor", "sensor_grid", "glance", "progress"]],
  ["ws.group_charts", ["statistics", "breakdown"]],
  ["ws.group_pictures", ["image", "camera", "picture"]],
];

/// Kinds of picture card in the add panel, with their icons
const VARIANTS = { camera: "camera", picture: "picture" };

function renderCardTypes() {
  const items = [];
  const groups = PALETTE.map(([label, names]) => {
    // A camera and a picture of your own are picture cards too
    const row = names.filter((n) => VARIANTS[n] || CARD_TYPES[n]).map((name) => {
      const k = VARIANTS[name] ? "image" : name;
      const variant = VARIANTS[name] ? name : null;
      const icon = VARIANTS[name] || CARD_TYPES[k].icon;
      const add = () => addCard(k, null, variant);
      const item = el("div", { class: "palette-item", role: "button", tabindex: "0", "data-type": k, "data-variant": variant, title: T("ws.add_item_title"),
          onclick: add, onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); add(); } },
          oncontextmenu: (ev) => { ev.preventDefault(); paletteMenu(k, variant, ev.clientX, ev.clientY); } },
        el("img", { src: iconUrl(icon), alt: "" }), el("span", {}, typeLabel(name)));
      items.push(item);
      return item;
    });
    return el("div", { class: "palette-group" }, el("div", { class: "palette-label" }, T(label)), row);
  });
  $("palette").replaceChildren(...groups);
  makeDraggable(items);
}

/// Right-click on a card type: add it here or to another page
function paletteMenu(type, variant, x, y) {
  showMenu(x, y, [
    menuItem(T("ws.add_here"), () => addCard(type, null, variant)),
    subMenu(T("ws.add_to_page"), cfg.pages.map((q, j) => j === page ? null : menuItem(q.title || T("design.untitled"), () => {
      showPage(j);
      addCard(type, null, variant);
    })).filter(Boolean)),
  ]);
}

/// Right-click on a page tab
function tabMenu(i, x, y) {
  showMenu(x, y, [
    menuItem(T("ws.rename"), () => { showPage(i); setTimeout(() => { const t = $("pageTabs").querySelectorAll(".tab")[i]; if (t) renameTab(t, i); }, 0); }),
    menuItem(T("ws.duplicate_page"), () => {
      const copy = JSON.parse(JSON.stringify(cfg.pages[i]));
      copy.id = uniquePageId(copy.id);
      copy.title = T("ws.copy_of", { title: copy.title });
      delete copy.imported_from;
      cfg.pages.splice(i + 1, 0, copy);
      showPage(i + 1);
      sync();
    }),
    el("hr"),
    menuItem(T("design.move_left"), () => { showPage(i); movePage(-1); }, { disabled: i === 0 }),
    menuItem(T("design.move_right"), () => { showPage(i); movePage(1); }, { disabled: i === cfg.pages.length - 1 }),
    el("hr"),
    menuItem(T("design.delete_page"), () => { showPage(i); deletePage(); }, { danger: true }),
  ]);
}

/// Let `items` be dragged onto the page; their gs-w/gs-h set the size.
function makeDraggable(items) {
  if (!items.length || typeof GridStack === "undefined") return;
  updateDragSizes();
  GridStack.setupDragIn(items, { appendTo: "body", helper: dragGhost });
  for (const n of items) {
    // While dragging, the page isn't rebuilt under the pointer
    n.addEventListener("dragstart", () => { updateDragSizes(); $("layoutStage").classList.add("moving"); });
    n.addEventListener("dragstop", () => { $("layoutStage").classList.remove("moving"); setTimeout(() => renderLayout(), 0); });
  }
}

/// The largest of a card's sizes that still fits on the page: its own, as
/// wide but lower, as high but narrower, then its smallest
function setDragSize(n, w, h, mw, mh) {
  const [fw, fh] = [[w, h], [w, mh], [mw, h], [mw, mh]].find(([w, h]) => !gs || gs.engine.willItFit({ w, h })) || [mw, mh];
  n.setAttribute("gs-w", fw);
  n.setAttribute("gs-h", fh);
}

/// What follows the pointer: a box the size the card will have on the page.
function dragGhost(src) {
  updateDragSizes();
  const ghost = src.cloneNode(true);
  ghost.removeAttribute("id");
  ghost.classList.add("drag-ghost");
  if (gs) {
    const L = layouts[page], m = L.gap / 2 * (parseFloat($("layoutStage").style.width) / L.screen[0]);
    const w = +src.getAttribute("gs-w"), h = +src.getAttribute("gs-h");
    // Gridstack sizes the helper like its source; these win over that
    ghost.style.setProperty("--gw", w * gs.cellWidth() - 2 * m + "px");
    ghost.style.setProperty("--gh", h * gs.getCellHeight() - 2 * m + "px");
  }
  return ghost;
}

/// Size each draggable item takes on this page's grid: a new card's for a
/// type, the smallest size for a card that has no room.
function updateDragSizes() {
  const L = layouts[page];
  if (!L) return;
  // A card put aside comes back at its natural size where that fits, else its smallest
  document.querySelectorAll("#parked .shelf-item").forEach((n) => {
    const i = +n.dataset.card;
    const [w, h] = L.naturals[i] || [2, 2], [mw, mh] = L.mins[i] || [1, 1];
    setDragSize(n, w, h, mw, mh);
  });
  document.querySelectorAll("#palette .palette-item").forEach((n) => {
    const [w, h, mw, mh] = L.new_sizes[n.dataset.type] || [2, 2, 1, 1];
    setDragSize(n, w, h, mw, mh);
  });
}

/// Beside the page: cards put aside (dragged off the page, or with the
/// card menu), which can be dragged back, and cards that have no room,
/// which the server places as soon as there is room.
function renderTray() {
  const p = cfg.pages[page];
  if (layoutStale()) return;
  const all = p && !previewing ? p.cards.map((c, i) => [c, i]) : [];
  const parked = all.filter(([c]) => c.parked);
  const off = all.filter(([, i]) => isOffscreen(i));
  const shelf = $("traySection");
  const was = !shelf.classList.contains("hidden");
  const now = !!(parked.length || off.length);
  shelf.classList.toggle("hidden", !now);
  $("parkedSection").classList.toggle("hidden", !parked.length);
  $("offSection").classList.toggle("hidden", !off.length);
  const L = layouts[page];
  const key = JSON.stringify([page, openCard, all.filter(([c], i) => c.parked || isOffscreen(i)).map(([c, i]) => [i, !!c.parked, cardSummary(c).title, L?.mins[i]])]);
  if ($("tray").dataset.key !== key) {
    $("tray").dataset.key = key;
    const item = ([c, i]) => {
      const { title } = cardSummary(c);
      const [w, h] = L?.mins[i] || [1, 1];
      return el("div", { class: "shelf-item" + (c.parked ? " parked" : "") + (openCard === i ? " selected" : ""), role: "button", tabindex: "0", "data-card": i,
          title: T(c.parked ? "ws.parked_item_title" : "ws.tray_item_title"),
          onclick: () => selectCard(i), onkeydown: (ev) => { if (ev.key === "Enter") selectCard(i); },
          oncontextmenu: (ev) => { ev.preventDefault(); selectCard(i); openCardMenu(i, ev.clientX, ev.clientY); } },
        el("img", { src: iconUrl(c.icon || autoIcon(c)), alt: "" }), el("span", {}, title),
        c.parked ? null : el("span", { class: "size" }, T("ws.needs_cells", { w, h })));
    };
    const parkedItems = parked.map(item);
    $("parked").replaceChildren(...parkedItems);
    $("tray").replaceChildren(...off.map(item));
    makeDraggable(parkedItems);
  }
  // The page gets narrower or wider with the shelf
  if (was !== now) renderLayout(true);
}

/// Put card `i` aside: kept, but off the page
function parkCard(i) {
  const c = cfg.pages[page].cards[i];
  c.parked = true;
  delete c.pos;
  renderDesign();
  sync();
}

/// Back on the page, in the first free spot
function unparkCard(i, pos) {
  const c = cfg.pages[page].cards[i];
  delete c.parked;
  if (pos) c.pos = pos; else delete c.pos;
  openCard = i;
  renderDesign();
  sync();
}

/// Whether the server's layout of this page predates cards added or removed
function layoutStale() {
  const L = layouts[page], p = cfg.pages[page];
  return !!(L && p && L.places.length !== p.cards.length);
}

/// The workspace fills the window below the header.
function fitTop() {
  document.documentElement.style.setProperty("--top", document.querySelector("header.top").offsetHeight + $("updateBar").offsetHeight + "px");
}

// ---------- Lovelace import ----------
// The cards live in Home Assistant; the setup tool reads them once and turns
// them into native pages here.
let dashboards = null;
async function loadDashboards(force = false) {
  const sel = $("lovelaceDash");
  if (!cfg || !cfg.home_assistant.token) {
    sel.replaceChildren(el("option", {}, T("lovelace.no_token")));
    sel.disabled = true;
    return;
  }
  if (dashboards && !force) return;
  sel.disabled = true;
  sel.replaceChildren(el("option", {}, T("lovelace.loading")));
  try {
    dashboards = await api("/api/lovelace/dashboards");
    sel.replaceChildren(...dashboards.map((d) => el("option", { value: d.url_path }, d.title || d.url_path || "Overview")));
    sel.disabled = false;
  } catch (e) {
    dashboards = null;
    sel.replaceChildren(el("option", {}, T("lovelace.load_failed")));
    $("lovelaceResult").replaceChildren(el("div", { class: "notice err" }, e.message));
  }
}

async function importLovelace() {
  const box = $("lovelaceResult");
  const btn = $("lovelaceImport");
  btn.disabled = true;
  box.replaceChildren(el("div", { class: "notice" }, T("lovelace.importing")));
  try {
    const r = await api("/api/lovelace/import", { method: "POST", body: { url_path: $("lovelaceDash").value } });
    recordPending();
    // Pages this dashboard produced before are replaced, and those it no longer
    // produces are removed. A page of your own is never overwritten, even when
    // it happens to have the same id: it gets a new id and the import is added.
    const incoming = new Set(r.pages.map((p) => p.id));
    let removed = 0;
    cfg.pages = cfg.pages.filter((p) => {
      if (p.imported_from === r.source && !incoming.has(p.id)) { removed += 1; return false; }
      return true;
    });
    let replaced = 0;
    for (const p of r.pages) {
      const i = cfg.pages.findIndex((x) => x.id === p.id);
      if (i < 0) { cfg.pages.push(p); continue; }
      if (cfg.pages[i].imported_from === r.source) { cfg.pages[i] = p; replaced += 1; continue; }
      p.id = uniquePageId(p.id);
      cfg.pages.push(p);
    }
    const cards = r.pages.reduce((n, p) => n + p.cards.length, 0);
    const parts = [el("div", { class: "notice ok" }, T("lovelace.imported", { pages: r.pages.length, cards }))];
    if (replaced) parts.push(el("div", { class: "notice" }, T("lovelace.replaced", { n: replaced })));
    if (removed) parts.push(el("div", { class: "notice" }, T("lovelace.removed", { n: removed })));
    if (r.skipped.length) {
      parts.push(el("div", { class: "notice warn" },
        el("div", {}, T("lovelace.skipped")),
        el("ul", {}, r.skipped.map((s) => el("li", {}, T("lovelace.skipped_item", { card: s.card, count: s.count }))))));
    }
    box.replaceChildren(...parts);
    page = Math.max(0, cfg.pages.findIndex((p) => p.id === r.pages[0].id));
    renderDesign();
    sync();
  } catch (e) {
    box.replaceChildren(el("div", { class: "notice err" }, e.message));
  } finally {
    btn.disabled = false;
  }
}

function renderDesign() {
  if (!cfg) return;
  if (page >= cfg.pages.length) page = Math.max(0, cfg.pages.length - 1);
  renderPageChips();
  renderInspector();
  renderLayout();
  renderOverflow();
}

function renderPageChips() {
  // In the workspace, a click on the open page's tab edits its name
  const open = (cls, i) => (ev) => (cls === "tab" && i === page ? renameTab(ev.currentTarget, i) : showPage(i));
  const chip = (cls) => (p, i) => el("button", { type: "button", class: cls + (i === page ? " active" : ""), onclick: open(cls, i) },
    el("img", { src: iconUrl(p.icon), alt: "" }), p.title || T("design.untitled"),
    hidden[i] ? el("span", { class: "badge", title: T("design.overflow_badge") }, String(hidden[i])) : null);
  const tabs = cfg.pages.map(chip("tab"));
  tabs.forEach((t, i) => {
    dragTab(t, i);
    t.title = T("ws.tab_title");
    t.addEventListener("contextmenu", (ev) => { ev.preventDefault(); tabMenu(i, ev.clientX, ev.clientY); });
  });
  $("pageTabs").replaceChildren(...tabs);
  $("previewPages").replaceChildren(...cfg.pages.map(chip("chip")));
}

/// Page tabs are reordered by dragging them.
let draggedTab = null;
function dragTab(tab, i) {
  tab.draggable = true;
  const clear = () => $("pageTabs").querySelectorAll(".tab").forEach((t) => t.classList.remove("drop-before", "drop-after"));
  const after = (ev) => { const r = tab.getBoundingClientRect(); return ev.clientX > r.left + r.width / 2; };
  tab.addEventListener("dragstart", (ev) => { draggedTab = i; ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", String(i)); });
  tab.addEventListener("dragend", () => { draggedTab = null; clear(); });
  tab.addEventListener("dragover", (ev) => {
    if (draggedTab == null) return;
    ev.preventDefault();
    clear();
    if (draggedTab !== i) tab.classList.add(after(ev) ? "drop-after" : "drop-before");
  });
  tab.addEventListener("drop", (ev) => {
    if (draggedTab == null) return;
    ev.preventDefault();
    let to = i + (after(ev) ? 1 : 0);
    const from = draggedTab;
    draggedTab = null;
    clear();
    if (to > from) to -= 1;
    if (to === from) return;
    const current = cfg.pages[page];
    const [moved] = cfg.pages.splice(from, 1);
    cfg.pages.splice(to, 0, moved);
    page = cfg.pages.indexOf(current);
    renderDesign();
    sync();
  });
}

/// Edit a page's name in its tab
function renameTab(tab, i) {
  const p = cfg.pages[i];
  const input = el("input", { type: "text", class: "tab-edit", value: p.title, "aria-label": T("design.page_title") });
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const v = input.value.trim();
    input.remove();
    if (save && v && v !== p.title) { p.title = v; p.id = uniquePageIdFor(slug(v) || "page" + i, p); sync(); }
    renderPageChips();
    if (i === page && openCard == null) renderInspector();
  };
  input.onkeydown = (ev) => { if (ev.key === "Enter") finish(true); if (ev.key === "Escape") { ev.stopPropagation(); finish(false); } };
  input.onblur = () => finish(true);
  // Over the tab, not in it: keys typed in a field inside a button press it
  const r = tab.getBoundingClientRect();
  Object.assign(input.style, { left: r.left + "px", top: r.top + "px", width: Math.max(160, r.width) + "px", height: r.height + "px" });
  document.body.append(input);
  input.focus();
  input.select();
}

/// An id for page `p` that no other page has
function uniquePageIdFor(id, p) {
  let out = id, n = 2;
  while (cfg.pages.some((q) => q !== p && q.id === out)) { out = id + "_" + n; n += 1; }
  return out;
}

/// New pages filled with every entity of a kind; cards that don't fit wait
/// beside the page, to be moved or deleted.
const PAGE_PRESETS = {
  lights: ["ws.preset_lights", "lightbulb", (e) => e.domain === "light", (e) => ({ type: "light", entity_id: e.entity_id, show_brightness: false })],
  climate: ["ws.preset_climate", "thermometer", (e) => e.domain === "climate", (e) => ({ type: "climate", entity_id: e.entity_id, step: 0.5 })],
  covers: ["ws.preset_covers", "blinds", (e) => e.domain === "cover", (e) => ({ type: "cover", entity_id: e.entity_id })],
  switches: ["ws.preset_switches", "power", (e) => ["switch", "fan", "input_boolean"].includes(e.domain), (e) => ({ type: "switch", entity_id: e.entity_id })],
};
let presetCheck = null;
async function addPresetPage(key) {
  if (!entities.length) await loadEntities(false);
  const [title, icon, wanted, card] = PAGE_PRESETS[key];
  const found = entities.filter(wanted).sort((a, b) => (a.area || "").localeCompare(b.area || "") || a.name.localeCompare(b.name));
  if (!found.length) { toast(T(entities.length ? "ws.preset_none" : "ws.preset_no_ha")); return; }
  cfg.pages.push({ id: uniquePageId(key), title: T(title), icon, cards: found.map(card) });
  presetCheck = cfg.pages.length - 1;
  showPage(cfg.pages.length - 1);
  sync();
}

function showPage(i) {
  page = i;
  openCard = null;
  renderDesign();
  refreshPreview();
}

function addPage() {
  cfg.pages.push({ id: uniquePageId("page" + (cfg.pages.length + 1)), title: T("design.new_page"), icon: "home", cards: [] });
  showPage(cfg.pages.length - 1);
  sync();
}

/// A button showing the icon; it opens a searchable grid of all icons.
/// What the card is to the user: a picture card showing a camera is a camera
function cardKind(c) {
  if (c.type === "image" && c.file != null) return "picture";
  if (c.type === "image" && (c._camera || (c.entity_id || "").startsWith("camera."))) return "camera";
  return c.type;
}

/// The icon a card draws when none is chosen, as the dashboard picks it
function autoIcon(c) {
  if (c.type === "switch") return { fan: "fan", lock: "lock", cover: "door" }[(c.entity_id || "").split(".")[0]] || "power";
  if (c.type === "light") return "lightbulb";
  if (c.type === "scene") return "play";
  return VARIANTS[cardKind(c)] || CARD_TYPES[c.type]?.icon || "home";
}

function iconSelect(value, onchange, allowEmpty = true, auto = "home") {
  const img = el("img", { src: iconUrl(value || auto), alt: "" });
  const name = el("span", {}, value || T("design.icon_auto"));
  const btn = el("button", { type: "button", class: "iconpick", "aria-haspopup": "dialog" }, img, name);
  btn.onclick = (ev) => {
    ev.stopPropagation();
    if (iconPop) { closeIconPicker(); return; }
    openIconPicker(btn, value, allowEmpty, (v) => {
      value = v;
      img.src = iconUrl(v || auto);
      name.textContent = v || T("design.icon_auto");
      onchange(v);
      btn.focus();
    });
  };
  return btn;
}

let iconPop = null;
function closeIconPicker() { iconPop?.remove(); iconPop = null; }

function openIconPicker(anchor, value, allowEmpty, pick) {
  closeIconPicker();
  const search = el("input", { type: "text", placeholder: T("ws.icon_search"), spellcheck: "false" });
  const grid = el("div", { class: "icongrid", role: "listbox" });
  const choose = (v) => { closeIconPicker(); pick(v); };
  const fill = () => {
    const q = search.value.trim().toLowerCase();
    const found = icons.filter((n) => !q || n.includes(q));
    if (!found.length) { grid.replaceChildren(el("p", { class: "hint", style: "grid-column:1/-1;margin:6px" }, T("ws.no_icons"))); return; }
    grid.replaceChildren(
      ...(allowEmpty && !q ? [el("button", { type: "button", class: "auto" + (value ? "" : " active"), onclick: () => choose(null) }, T("design.icon_auto"))] : []),
      ...found.map((n) => el("button", { type: "button", title: n, "aria-label": n, class: n === value ? "active" : "", onclick: () => choose(n) },
        el("img", { src: iconUrl(n), alt: "", loading: "lazy" }))));
  };
  search.oninput = fill;
  search.onkeydown = (ev) => {
    if (ev.key === "Escape") { ev.stopPropagation(); closeIconPicker(); anchor.focus(); }
    if (ev.key === "Enter") { ev.preventDefault(); grid.querySelector("button:not(.auto)")?.click(); }
  };
  fill();
  iconPop = el("div", { class: "iconpop", onclick: (ev) => ev.stopPropagation() }, search, grid);
  const r = anchor.getBoundingClientRect();
  iconPop.style.width = Math.max(260, r.width) + "px";
  document.body.append(iconPop);
  const h = iconPop.offsetHeight;
  iconPop.style.left = Math.max(8, Math.min(r.left, innerWidth - iconPop.offsetWidth - 8)) + "px";
  iconPop.style.top = (r.bottom + 4 + h > innerHeight ? Math.max(8, r.top - 4 - h) : r.bottom + 4) + "px";
  search.focus();
}

// ---------- Properties panel ----------
// Shows the selected card, or the page when no card is selected.
function renderInspector() {
  const box = $("inspector");
  const p = cfg.pages[page];
  if (!p) { box.replaceChildren(el("p", { class: "hint" }, T("design.no_pages"))); return; }
  const c = openCard != null ? p.cards[openCard] : null;
  box.replaceChildren(...(c ? cardInspector(c, openCard) : pageInspector(p)));
}

function pageInspector(p) {
  const title = el("input", { type: "text", value: p.title });
  title.oninput = () => { p.title = title.value; p.id = uniquePageIdFor(slug(title.value) || "page" + page, p); renderPageChipsSoon(); sync(); };
  return [
    el("h3", { class: "ws-head" }, T("ws.page")),
    el("div", { class: "grid2" },
      el("label", { class: "field" }, T("design.page_title"), title),
      el("label", { class: "field" }, T("design.tab_icon"), iconSelect(p.icon, (v) => { p.icon = v || "home"; renderPageChips(); sync(); }, false))),
    el("div", { class: "insp-actions", style: "margin-top:12px" },
      el("button", { class: "btn small", disabled: page === 0, onclick: () => movePage(-1) }, T("design.move_left")),
      el("button", { class: "btn small", disabled: page === cfg.pages.length - 1, onclick: () => movePage(1) }, T("design.move_right")),
      el("span", { class: "spacer" }),
      el("button", { class: "btn small danger", onclick: deletePage }, T("design.delete_page"))),
    p.cards.length ? null : el("p", { class: "hint insp-section" }, T("ws.no_cards")),
  ].filter(Boolean);
}

function cardInspector(c, i) {
  const { t, title, sub } = cardSummary(c);
  const cards = cfg.pages[page].cards;
  return [
    el("div", { class: "insp-head" },
      el("button", { class: "btn small icon", type: "button", title: T("ws.back_to_page"), "aria-label": T("ws.back_to_page"), onclick: deselectCard }, "←"),
      el("img", { id: "inspIcon", src: iconUrl(c.icon || autoIcon(c)), alt: "" }),
      el("div", { style: "min-width:0" }, el("div", { class: "title", id: "inspTitle" }, title), el("div", { class: "sub" }, typeLabel(cardKind(c))))),
    el("div", { id: "inspHidden", class: "notice warn" + (isOffscreen(i) ? "" : " hidden"), style: "margin:0 0 12px" }, T("ws.card_hidden")),
    cardForm(c),
    el("div", { class: "insp-section insp-actions" },
      moveToSelect(i),
      el("button", { class: "btn small", onclick: () => duplicateCard(i) }, T("ws.duplicate")),
      el("span", { class: "spacer" }),
      el("button", { class: "btn small danger", onclick: () => deleteCard(i) }, T("design.delete_card"))),
  ].filter(Boolean);
}

function duplicateCard(i) {
  const cards = cfg.pages[page].cards;
  const copy = JSON.parse(JSON.stringify(cards[i]));
  // The copy keeps the size: its place is taken, so the server moves it to
  // the first free spot of that size (below it, if there is room)
  cards.splice(i + 1, 0, copy);
  // Cards after it keep their places: only the indices move
  openCard = i + 1;
  renderDesign();
  sync();
}

function deleteCard(i) {
  cfg.pages[page].cards.splice(i, 1);
  openCard = null;
  renderDesign();
  sync();
}

let chipsSoonTimer = null;
function renderPageChipsSoon() {
  clearTimeout(chipsSoonTimer);
  chipsSoonTimer = setTimeout(renderPageChips, 300);
}

const slug = (s) => s.toLowerCase().normalize("NFKD").replace(/[^\w]+/g, "_").replace(/^_|_$/g, "");

// An id that no page uses yet, so an import never overwrites one of your own.
function uniquePageId(id) {
  let out = id, n = 2;
  while (cfg.pages.some((p) => p.id === out)) { out = id + "_" + n; n += 1; }
  return out;
}

function movePage(d) {
  const [p] = cfg.pages.splice(page, 1);
  page += d;
  cfg.pages.splice(page, 0, p);
  renderDesign(); sync();
}
function deletePage() {
  if (!confirm(T("design.delete_page_confirm", { title: cfg.pages[page].title }))) return;
  cfg.pages.splice(page, 1);
  page = Math.max(0, page - 1);
  renderDesign(); sync();
}

function cardSummary(c) {
  const t = CARD_TYPES[c.type] || { icon: "home" };
  const e = c.entity_id ? entityById(c.entity_id) : null;
  const title = c.title || (e ? shortName(e) : "") || typeLabel(cardKind(c));
  let sub = c.entity_id || "";
  if (c.type === "sensor_grid") sub = T("design.sensors_count", { n: (c.sensors || []).length });
  if (c.type === "scenes_row") sub = T("design.buttons_count", { n: (c.scenes || []).length });
  const tags = [el("span", { class: "tag" }, typeLabel(cardKind(c)))];
  if (entities.length && c.entity_id && !e) tags.push(el("span", { class: "tag err", title: T("design.not_found_title") }, T("design.not_found")));
  return { t, title, sub, tags };
}

function moveToSelect(i) {
  if (cfg.pages.length < 2) return null;
  const sel = el("select", { class: "compact", title: T("design.move_to_title") },
    el("option", { value: "" }, T("design.move_to")),
    cfg.pages.map((p, j) => j === page ? null : el("option", { value: j }, p.title)));
  sel.onchange = () => {
    if (sel.value === "") return;
    moveCard(i, +sel.value);
  };
  return sel;
}

function entityInput(value, domains, onchange) {
  const input = el("input", { type: "text", list: datalistFor(domains), value: value || "", placeholder: domains.slice(0, 3).join(" / ") + ".…", spellcheck: "false" });
  const meta = el("div", { class: "entity-meta" });
  const update = () => {
    const e = entityById(input.value.trim());
    meta.textContent = e ? `${e.name}${e.area ? " · " + e.area : ""} — ${e.state}${e.unit ? " " + e.unit : ""}` : (input.value && entities.length ? T("design.entity_not_found") : "");
  };
  input.addEventListener("change", () => { update(); onchange(input.value.trim(), entityById(input.value.trim())); });
  update();
  return [input, meta];
}

function cardForm(c) {
  const schema = CARD_TYPES[c.type];
  const form = el("div", { class: "cardform grid2" });
  for (const [key, kind = key === "entity_id" ? "entity" : key === "icon" ? "icon" : "text", label, opts = {}] of schema.fields) {
    if (kind === "entity" && cardKind(c) === "picture") {
      form.append(el("label", { class: "field full" }, T("design.picture_file"), pictureUpload(c)));
    } else if (kind === "entity") {
      const [input, meta] = entityInput(c.entity_id, cardKind(c) === "camera" ? ["camera"] : schema.domains, (v, e) => {
        c.entity_id = v;
        if (e && c.type === "scene" && !c.title) c.title = shortName(e);
        renderCardsSoon(); sync();
      });
      form.append(el("label", { class: "field full" }, T("design.entity"), input, meta));
    } else if (kind === "entity2") {
      // A second, optional entity (a time left next to a progress)
      const [input, meta] = entityInput(c[key], opts.domains, (v) => { if (v) c[key] = v; else delete c[key]; sync(); });
      form.append(el("label", { class: "field full" }, T(label), input, meta));
    } else if (kind === "icon") {
      form.append(el("label", { class: "field" }, T("design.icon"), iconSelect(c.icon, (v) => { c.icon = v; if (!v) delete c.icon; renderCardsSoon(); sync(); }, true, autoIcon(c))));
    } else if (kind === "bool") {
      const cb = el("input", { type: "checkbox", checked: !!c[key] });
      cb.onchange = () => { c[key] = cb.checked; sync(); };
      form.append(el("label", { class: "check" }, cb, T(label)));
    } else if (kind === "number") {
      const n = el("input", { type: "number", value: c[key] ?? "", min: opts.min, max: opts.max, step: opts.step || 1 });
      n.onchange = () => {
        const v = parseFloat(n.value) || schema.defaults?.[key];
        if (v == null) delete c[key]; else c[key] = v;
        sync();
      };
      form.append(el("label", { class: "field" }, T(label), n));
    } else if (kind === "select") {
      const sel = el("select", { "data-key": key, onchange: () => { c[key] = sel.value; sync(); } },
        (opts.options || []).map((v) => el("option", { value: v, selected: v === c[key] }, T((opts.label || "design.opt_") + v))));
      form.append(el("label", { class: "field" }, T(label), sel));
    } else if (kind === "range") {
      form.append(el("label", { class: "field" }, T(label), rangeSelect(c, form)));
    } else if (kind === "list") {
      form.append(listEditor(c, key, T(label), opts));
    } else {
      const placeholder = key === "title" && c.type !== "scene" && c.type !== "heading" ? T("design.title_auto") : "";
      const t = el("input", { type: "text", value: c[key] || "", placeholder });
      t.oninput = () => { if (t.value) c[key] = t.value; else if (key === "title" && c.type === "scene") c[key] = ""; else delete c[key]; renderCardsSoon(); sync(); };
      const text = label ? T(label) : key === "title" ? T("design.title") : key === "subtitle" ? T("design.subtitle") : key;
      form.append(el("label", { class: "field" }, text, t));
    }
  }
  // The Kobo decodes pictures itself, and the older ones have little memory.
  if (c.type === "image" && (!cfg.device.model || cfg.device.model === "auto" || LOW_MEMORY_MODELS.includes(cfg.device.model))) {
    form.append(el("p", { class: "hint", style: "grid-column: 1 / -1; margin: 4px 0 0" }, T("design.image_memory_hint")));
  }
  return form;
}

/// The file of a picture card: its name and a button to choose another.
/// The file is checked and kept by the setup tool, then goes to the Kobo
/// with the next install.
function pictureUpload(c) {
  const name = el("span", { class: "hint", style: "margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, c.file || T("design.no_file"));
  const note = el("div", { class: "entity-meta" });
  const input = el("input", { type: "file", accept: "image/*", class: "hidden" });
  input.onchange = async () => {
    const f = input.files[0];
    if (!f) return;
    note.textContent = T("design.uploading");
    try {
      const r = await fetch(`/api/pictures?name=${encodeURIComponent(f.name)}`, { method: "POST", body: f });
      const data = await r.json();
      if (!r.ok) throw new Error(data.key ? T("errors." + data.key, data.args || {}) : data.error);
      c.file = data.file;
      name.textContent = data.file;
      note.textContent = `${data.width}×${data.height}`;
      renderCardsSoon();
      sync();
    } catch (e) {
      note.textContent = e.message;
    }
  };
  return el("div", {},
    el("div", { class: "row", style: "flex-wrap:nowrap" }, name,
      el("button", { type: "button", class: "btn small", onclick: () => input.click() }, T("design.choose_file")), input),
    note);
}

/// How far back a statistics chart goes: hours or days. A short range
/// brings a matching period (bars of 5 minutes or an hour) with it.
const RANGES = ["1h", "2h", "4h", "6h", "12h", "24h", "2d", "3d", "7d", "14d", "30d", "90d", "180d", "365d"];
function rangeSelect(c, form) {
  const current = c.hours ? c.hours + "h" : (c.days || 14) + "d";
  const options = RANGES.includes(current) ? RANGES : [...RANGES, current];
  const label = (v) => T(v.endsWith("h") ? "design.range_hours" : "design.range_days", { n: parseInt(v) });
  const sel = el("select", {}, options.map((v) => el("option", { value: v, selected: v === current }, label(v))));
  sel.onchange = () => {
    const n = parseInt(sel.value);
    let hours;
    if (sel.value.endsWith("h")) { c.hours = n; hours = n; } else { delete c.hours; c.days = n; hours = n * 24; }
    const period = hours <= 6 ? "5minute" : hours <= 48 ? "hour" : c.period === "5minute" || c.period === "hour" ? "day" : c.period;
    if (period !== c.period) {
      c.period = period;
      const p = form.querySelector("select[data-key=period]");
      if (p) p.value = period;
    }
    sync();
  };
  return sel;
}

function listEditor(c, key, label, opts) {
  const items = c[key] || (c[key] = []);
  const wrap = el("div", { class: "sublist" }, el("div", { class: "field" }, `${label} (${items.length}/${opts.max})`));
  items.forEach((item, j) => {
    const [input, meta] = entityInput(item.entity_id, opts.domains, (v, e) => {
      item.entity_id = v;
      if (e && !item.title) { item.title = shortName(e); title.value = item.title; }
      if (e && opts.item === "sensor" && !item.unit && e.unit) { item.unit = e.unit; unit.value = e.unit; }
      sync();
    });
    const title = el("input", { type: "text", value: item.title || "", placeholder: T("design.label") });
    title.oninput = () => { item.title = title.value; sync(); };
    const unit = el("input", { type: "text", value: item.unit || "", placeholder: T("design.unit") });
    unit.oninput = () => { if (unit.value) item.unit = unit.value; else delete item.unit; sync(); };
    wrap.append(el("div", { class: "subitem" },
      el("label", { class: "field" }, T("design.entity"), input, meta),
      el("label", { class: "field" }, T("design.label"), title),
      el("label", { class: "field" }, T("design.icon"), iconSelect(item.icon, (v) => { if (v) item.icon = v; else if (opts.item === "scene") item.icon = "play"; else delete item.icon; sync(); }, opts.item !== "scene", "zap")),
      opts.item === "sensor" ? el("label", { class: "field" }, T("design.unit"), unit) : el("span"),
      // Order: up, down, and out
      el("div", { class: "row subitem-tools" },
        el("button", { type: "button", class: "btn small icon", title: T("design.move_up"), "aria-label": T("design.move_up"), disabled: j === 0,
          onclick: () => { [items[j - 1], items[j]] = [items[j], items[j - 1]]; renderInspector(); sync(); } }, "↑"),
        el("button", { type: "button", class: "btn small icon", title: T("design.move_down"), "aria-label": T("design.move_down"), disabled: j === items.length - 1,
          onclick: () => { [items[j + 1], items[j]] = [items[j], items[j + 1]]; renderInspector(); sync(); } }, "↓"),
        el("button", { type: "button", class: "btn small icon danger", title: T("design.remove"), onclick: () => { items.splice(j, 1); renderInspector(); sync(); } }, "✕"))));
  });
  if (items.length < opts.max) {
    wrap.append(el("div", {}, el("button", { class: "btn small", onclick: () => {
      items.push(opts.item === "scene" ? { entity_id: "", title: "", icon: "play" } : { entity_id: "", title: "" });
      renderInspector();
    } }, T("design.add"))));
  }
  return wrap;
}

let renderSoonTimer = null;
function renderCardsSoon() {
  // Refresh the panel's heading without stealing focus from the input being edited.
  clearTimeout(renderSoonTimer);
  renderSoonTimer = setTimeout(() => {
    const c = openCard != null ? cfg.pages[page]?.cards[openCard] : null;
    if (!c || !$("inspTitle")) return;
    const { t, title } = cardSummary(c);
    $("inspTitle").textContent = title;
    $("inspIcon").src = iconUrl(c.icon || autoIcon(c));
  }, 300);
}

function newCard(type) {
  const card = { type, ...(JSON.parse(JSON.stringify(CARD_TYPES[type].defaults || {}))) };
  if (CARD_TYPES[type].domains) card.entity_id = "";
  return card;
}

function addCard(type, pos, variant = null) {
  if (!cfg.pages.length) cfg.pages.push({ id: "home", title: T("design.new_page"), icon: "home", cards: [] });
  const card = newCard(type);
  if (pos) card.pos = pos;
  // Only the editor reads it, until a camera entity says the same
  if (variant === "camera") card._camera = true;
  // A picture of your own: a file instead of an entity
  if (variant === "picture") card.file = "";
  cfg.pages[page].cards.push(card);
  addedCheck = { page, index: cfg.pages[page].cards.length - 1, type };
  openCard = cfg.pages[page].cards.length - 1;
  renderDesign();
  $("inspector").querySelector("input")?.focus();
  sync();
}

function renderOverflow() {
  const n = hidden[page] || 0;
  const msg = n === 1 ? T("ws.overflow_one") : n > 1 ? T("ws.overflow_many", { n }) : "";
  renderTray();
  for (const id of ["overflowWarn", "previewHidden"]) {
    $(id).textContent = msg;
    $(id).classList.toggle("hidden", !n);
  }
  if (openCard != null) $("inspHidden")?.classList.toggle("hidden", !isOffscreen(openCard));
}

/// Whether card `i` of the current page has no room and isn't shown
function isOffscreen(i) {
  const L = layouts[page];
  // Put aside on purpose: not a card that doesn't fit
  if (cfg.pages[page]?.cards[i]?.parked) return false;
  // Until the server has laid out a card just added or removed, say nothing
  if (layoutStale()) return false;
  if (L) return !L.places[i];
  return i >= (cfg.pages[page]?.cards.length || 0) - (hidden[page] || 0);
}

// ---------- Layout editor ----------
// The page's grid is laid over its preview. Cards are gridstack widgets the
// size of the cards on the preview: dragging or resizing one writes `pos` for
// every card; the server then redraws the preview and sends back where each
// card ended up (`layouts`), which the grid is rebuilt from.
let gs = null;
let layoutKey = "";
// Preview mode: the page as the Kobo shows it, without the design panels
let previewing = false;

/// Fit the page's screen into the canvas area, as large as it goes.
function fitStage(L) {
  const wrap = $("canvasWrap"), dev = $("wsDevice"), stage = $("layoutStage");
  dev.classList.toggle("landscape", L.screen[0] > L.screen[1]);
  const cs = getComputedStyle(wrap), ds = getComputedStyle(dev);
  const shelf = $("traySection");
  const shelfW = shelf.offsetParent ? shelf.offsetWidth + parseFloat(cs.columnGap || 0) : 0;
  const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - parseFloat(ds.paddingLeft) - parseFloat(ds.paddingRight) - shelfW;
  const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(ds.paddingTop) - parseFloat(ds.paddingBottom);
  const s = Math.max(0.05, Math.min(w / L.screen[0], h / L.screen[1]));
  stage.style.width = L.screen[0] * s + "px";
  stage.style.height = L.screen[1] * s + "px";
  return s;
}

/// Which page tab of the drawn header is at a screen position, if any
function tabAt(x, y) {
  const L = layouts[page], stage = $("layoutStage");
  if (!L || !L.tab_bar || !cfg.pages.length) return null;
  const r = stage.getBoundingClientRect(), s = r.width / L.screen[0];
  const ux = (x - r.left) / s, uy = (y - r.top) / s, b = L.tab_bar;
  if (ux < b.x || ux > b.x + b.w || uy < b.y || uy > b.y + b.h) return null;
  return Math.min(cfg.pages.length - 1, Math.floor((ux - b.x) / (b.w / cfg.pages.length)));
}

/// A tap on the preview works as on the Kobo, without reaching Home
/// Assistant: lights toggle, thermostats step, tabs open their page, the
/// light button dims the screen.
async function previewTap(ev) {
  const img = $("layoutImg"), r = img.getBoundingClientRect();
  if (!img.naturalWidth) return;
  const x = (ev.clientX - r.left) / r.width * img.naturalWidth;
  const y = (ev.clientY - r.top) / r.height * img.naturalHeight;
  try {
    const res = await api("/api/preview/tap", { method: "POST", body: { page, x, y } });
    if (res.page != null && res.page !== page) showPage(res.page);
    if (res.light_off != null) $("layoutStage").classList.toggle("dim", res.light_off);
    if (res.light_off != null || res.redraw) refreshPreview();
  } catch { /* the preview stays as it was */ }
}

function setPreviewing(on) {
  previewing = on;
  renderTray();
  $("ws").classList.toggle("previewing", on);
  $("modeDesign").classList.toggle("active", !on);
  $("modePreview").classList.toggle("active", on);
  renderLayout(true);
  refreshPreview();
}

function renderLayout(force = false) {
  const p = cfg && cfg.pages[page];
  const L = layouts[page];
  $("wsDevice").classList.toggle("hidden", !p || !L);
  $("noPages").classList.toggle("hidden", !!p);
  const stage = $("layoutStage");
  if (!p || !L || !$("canvasWrap").offsetParent) return;
  // Not under the pointer: rebuilt when the drag or resize ends
  if (stage.classList.contains("moving")) return;
  // Cards added or removed since this layout: wait for the server's
  if (layoutStale()) return;
  const s = fitStage(L);
  const labels = p.cards.map((c) => cardSummary(c).title);
  const key = JSON.stringify([page, L, s, labels, previewing]);
  if (!force && key === layoutKey && (gs || previewing)) return;
  layoutKey = key;
  const hadFocus = document.activeElement?.closest?.("#layoutBox .grid-stack-item")?.getAttribute("gs-id");

  fillGridSelects(L.grid);
  updateDragSizes();
  const img = $("layoutImg");
  if (img.dataset.page !== String(page)) { img.dataset.page = page; img.src = previewUrl(); }
  const half = L.gap / 2;
  const frame = { left: (L.area.x - half) * s + "px", top: (L.area.y - half) * s + "px", width: (L.area.w + L.gap) * s + "px", height: (L.area.h + L.gap) * s + "px" };
  Object.assign($("layoutBox").style, frame);
  Object.assign($("layoutLines").style, frame);

  // Faint cell outlines, where cards can go
  const cw = (L.area.w + L.gap) / L.grid.columns * s, ch = (L.area.h + L.gap) / L.grid.rows * s, m = half * s;
  const lines = [];
  for (let y = 0; y < L.grid.rows; y++) for (let x = 0; x < L.grid.columns; x++) {
    lines.push(el("div", { style: `left:${x * cw + m}px;top:${y * ch + m}px;width:${cw - 2 * m}px;height:${ch - 2 * m}px` }));
  }
  $("layoutLines").replaceChildren(...lines);

  if (gs) { gs.destroy(true); gs = null; }
  const host = el("div", { class: "grid-stack" });
  $("layoutBox").replaceChildren(host);
  if (previewing) return;
  p.cards.forEach((c, i) => {
    const pl = L.places[i];
    if (!pl) return;
    // The server keeps places at least this big; never more than the place,
    // or gridstack grows cards into each other
    const [mw, mh] = [Math.min(L.mins[i][0], pl.w), Math.min(L.mins[i][1], pl.h)];
    const item = el("div", { class: "grid-stack-item" + (openCard === i ? " selected" : ""), tabindex: "0", "aria-label": labels[i],
        "gs-id": String(i), "gs-x": pl.x, "gs-y": pl.y, "gs-w": pl.w, "gs-h": pl.h, "gs-min-w": mw, "gs-min-h": mh },
      el("div", { class: "grid-stack-item-content" }, el("span", { class: "lbl" }, labels[i])));
    item.addEventListener("pointerdown", () => selectCard(i));
    // Gridstack blurs on pointer down; the arrow keys need the focus
    item.addEventListener("pointerup", () => item.focus({ preventScroll: true }));
    item.addEventListener("keydown", (ev) => onLayoutKey(ev, item));
    item.addEventListener("contextmenu", (ev) => { ev.preventDefault(); selectCard(i); openCardMenu(i, ev.clientX, ev.clientY); });
    host.append(item);
  });
  try {
    gs = GridStack.init({
      column: L.grid.columns, maxRow: L.grid.rows, minRow: L.grid.rows,
      cellHeight: ch, margin: m, mode: "float", animate: false,
      resizable: { handles: "e,se,s,sw,w" },
      // Card types from the add panel, and cards put aside
      acceptWidgets: (n) => n.classList.contains("palette-item") || n.classList.contains("shelf-item"),
      // Dropped on the shelf, a card is put aside
      removable: "#traySection",
    }, host);
  } catch (e) {
    // Shown, not editable: better than a frozen page
    console.error("layout editor:", e);
    gs = null;
    return;
  }
  gs.on("change", writePlaces);
  gs.on("dropped", (ev, prev, node) => {
    const n = node.el;
    const pos = { x: node.x, y: node.y, w: node.w, h: node.h };
    gs.removeWidget(n, true, false);
    if (n.dataset.type) addCard(n.dataset.type, pos, n.dataset.variant || null);
    else if (n.dataset.card != null) unparkCard(+n.dataset.card, pos);
  });
  gs.on("removed", (ev, items) => {
    const ids = items.map((n) => n.id).filter((id) => id != null && id !== "");
    if (!ids.length) return;
    const cards = cfg.pages[page].cards;
    for (const id of ids) { if (cards[+id]) { cards[+id].parked = true; delete cards[+id].pos; } }
    openCard = null;
    $("ws").classList.remove("dragging");
    renderDesign();
    sync();
  });
  gs.on("dragstart resizestart", (ev) => { stage.classList.add("moving"); if (ev.type === "dragstart") $("ws").classList.add("dragging"); });
  gs.on("dragstop resizestop", () => { stage.classList.remove("moving"); $("ws").classList.remove("dragging"); setTimeout(() => renderLayout(), 0); });
  if (hadFocus != null) host.querySelector(`[gs-id="${hadFocus}"]`)?.focus();
}

/// Every card's place, as the grid shows it now
function writePlaces() {
  const p = cfg.pages[page];
  if (!gs || !p) return;
  for (const n of gs.engine.nodes) {
    const c = p.cards[+n.id];
    if (c) c.pos = { x: n.x, y: n.y, w: n.w, h: n.h };
  }
  sync();
}

function selectCard(i) {
  if (openCard === i) return;
  openCard = i;
  renderInspector();
  markSelected();
}

function deselectCard() {
  if (openCard == null) return;
  openCard = null;
  renderInspector();
  markSelected();
}

function markSelected() {
  if (layoutStale()) return;
  renderTray();
  document.querySelectorAll("#layoutBox .grid-stack-item").forEach((n) => n.classList.toggle("selected", +n.getAttribute("gs-id") === openCard));
}

/// Arrow keys move the focused card a cell, Shift + arrows resize it.
function onLayoutKey(ev, item) {
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
  const n = item.gridstackNode;
  if (ev.key === "Enter") { selectCard(+item.getAttribute("gs-id")); return; }
  if (!d || !n || !gs) return;
  ev.preventDefault();
  if (ev.shiftKey) gs.update(item, { w: Math.max(n.minW || 1, n.w + d[0]), h: Math.max(n.minH || 1, n.h + d[1]) });
  else gs.update(item, { x: Math.max(0, n.x + d[0]), y: Math.max(0, n.y + d[1]) });
}

// ---------- Card menu (right click) ----------
let clipboard = null;

function closeCardMenu() { $("ctxMenu")?.remove(); }

function menuItem(label, action, opts = {}) {
  return el("button", { type: "button", role: "menuitem", class: opts.danger ? "danger" : "", disabled: !!opts.disabled,
      onclick: () => { closeCardMenu(); action(); } },
    label, opts.kbd ? el("span", { class: "kbd" }, opts.kbd) : null);
}

function subMenu(label, items) {
  if (!items.length) return null;
  return el("div", { class: "has-sub" }, el("button", { type: "button", role: "menuitem", "aria-haspopup": "menu" }, label),
    el("div", { class: "menu", role: "menu" }, items));
}

const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl+";

/// A menu of `items` at the pointer, kept on screen
function showMenu(x, y, items) {
  closeCardMenu();
  const menu = el("div", { id: "ctxMenu", class: "menu", role: "menu", onclick: (ev) => ev.stopPropagation(), oncontextmenu: (ev) => ev.preventDefault() },
    items.filter(Boolean));
  document.body.append(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  menu.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  if (x + r.width + 240 > innerWidth) menu.classList.add("flip");
  menu.querySelector("button")?.focus();
}

function openCardMenu(i, x, y) {
  closeCardMenu();
  const p = cfg.pages[page], c = p.cards[i], L = layouts[page];
  const node = $("layoutBox").querySelector(`[gs-id="${i}"]`);
  const resize = ([w, h]) => node && gs && gs.update(node, { w, h });
  const menu = el("div", { id: "ctxMenu", class: "menu", role: "menu", onclick: (ev) => ev.stopPropagation(), oncontextmenu: (ev) => ev.preventDefault() },
    menuItem(T("ws.duplicate"), () => duplicateCard(i), { kbd: MOD + "D" }),
    menuItem(T("ws.copy"), () => { clipboard = JSON.stringify(c); }, { kbd: MOD + "C" }),
    subMenu(T("ws.change_type"), compatibleTypes(c).map((t) => menuItem(typeLabel(t), () => changeType(i, t)))),
    subMenu(T("ws.move_to_page"), cfg.pages.map((q, j) => j === page ? null : menuItem(q.title || T("design.untitled"), () => moveCard(i, j))).filter(Boolean)),
    el("hr"),
    menuItem(T("ws.natural_size"), () => resize(L.naturals[i]), { disabled: !node }),
    menuItem(T("ws.smallest_size"), () => resize(L.mins[i]), { disabled: !node }),
    el("hr"),
    c.parked ? menuItem(T("ws.put_back"), () => unparkCard(i)) : menuItem(T("ws.put_aside"), () => parkCard(i)),
    el("hr"),
    menuItem(T("design.delete_card"), () => deleteCard(i), { danger: true, kbd: "Del" }));
  document.body.append(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  menu.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  // Submenus open to the left near the right edge
  if (x + r.width + 240 > innerWidth) menu.classList.add("flip");
  menu.querySelector("button")?.focus();
}

/// Types a card can become without losing its entity
function compatibleTypes(c) {
  if (!c.entity_id) return [];
  const domain = c.entity_id.split(".")[0];
  return Object.keys(CARD_TYPES).filter((t) => t !== c.type && CARD_TYPES[t].domains?.includes(domain));
}

/// Make card `i` a `type` card: the entity, title and icon stay where the new
/// type has them, the place stays, the rest starts from the defaults.
function changeType(i, type) {
  const cards = cfg.pages[page].cards, old = cards[i];
  const card = newCard(type);
  card.entity_id = old.entity_id;
  const keys = CARD_TYPES[type].fields.map(([k]) => k);
  for (const k of ["title", "subtitle", "icon", "unit"]) if (keys.includes(k) && old[k] != null) card[k] = old[k];
  if (type === "scene" && !card.title) card.title = shortName(entityById(old.entity_id)) || "";
  if (old.pos) card.pos = old.pos;
  cards[i] = card;
  openCard = i;
  renderDesign();
  sync();
}

function moveCard(i, to) {
  const [c] = cfg.pages[page].cards.splice(i, 1);
  // Its place was on the old page; it takes the first free one on the new.
  delete c.pos;
  cfg.pages[to].cards.push(c);
  openCard = null;
  renderDesign();
  sync();
}

function pasteCard() {
  if (!clipboard || !cfg.pages[page]) return;
  const c = JSON.parse(clipboard);
  // Same size as the copied card; where its place is taken (or off this
  // page's grid), the server finds it the first free spot of that size
  delete c.parked;
  cfg.pages[page].cards.push(c);
  openCard = cfg.pages[page].cards.length - 1;
  renderDesign();
  sync();
}

function fillGridSelects(grid) {
  const opts = (from, to, v) => Array.from({ length: to - from + 1 }, (_, k) => el("option", { value: from + k, selected: from + k === v }, String(from + k)));
  $("gridCols").replaceChildren(...opts(1, 12, grid.columns));
  $("gridRows").replaceChildren(...opts(2, 24, grid.rows));
}

/// A new grid size keeps each card on the same share of the screen, as near
/// as the new cells allow; the server moves cards that then overlap.
function resizeGrid() {
  const p = cfg.pages[page], L = layouts[page];
  if (!p || !L) return;
  const cols = +$("gridCols").value, rows = +$("gridRows").value;
  const sx = cols / L.grid.columns, sy = rows / L.grid.rows;
  // Cards are laid again in reading order, each at its scaled place or the
  // next free one below or after it, so none lands on another; overlaps
  // left to the server would shrink cards to their smallest
  const taken = Array.from({ length: rows }, () => Array(cols).fill(false));
  const free = (q) => q.x >= 0 && q.y >= 0 && q.x + q.w <= cols && q.y + q.h <= rows &&
    taken.slice(q.y, q.y + q.h).every((row) => row.slice(q.x, q.x + q.w).every((t) => !t));
  const take = (q) => { for (let y = q.y; y < q.y + q.h; y++) for (let x = q.x; x < q.x + q.w; x++) taken[y][x] = true; };
  const order = p.cards.map((c, i) => i).filter((i) => L.places[i]).sort((a, b) => L.places[a].y - L.places[b].y || L.places[a].x - L.places[b].x);
  p.cards.forEach((c, i) => { if (!L.places[i]) delete c.pos; });
  for (const i of order) {
    const pl = L.places[i];
    // The edges are scaled, not the sizes: cards side by side stay side by
    // side and still fill the row
    const x0 = Math.round(pl.x * sx), x1 = Math.round((pl.x + pl.w) * sx);
    const y0 = Math.round(pl.y * sy), y1 = Math.round((pl.y + pl.h) * sy);
    const w = Math.max(1, Math.min(cols, x1 - x0)), h = Math.max(1, Math.min(rows, y1 - y0));
    const want = { x: Math.min(cols - w, x0), y: Math.min(rows - h, y0), w, h };
    let spot = free(want) ? want : null;
    for (let y = want.y; !spot && y + h <= rows; y++) {
      for (let x = 0; x + w <= cols; x++) {
        const q = { x: (want.x + x) % (cols - w + 1), y, w, h };
        if (free(q)) { spot = q; break; }
      }
    }
    if (spot) { take(spot); p.cards[i].pos = spot; } else delete p.cards[i].pos;
  }
  p.grid = { columns: cols, rows };
  sync();
}

/// Lay the page out again from its cards, on the grid it has: the server
/// places cards without a place, as many as fit.
function autoLayout() {
  const p = cfg.pages[page];
  if (!p) return;
  p.cards.forEach((c) => delete c.pos);
  sync();
}


// ---------- Preview ----------
/// The canvas picture: grayscale and the sleep screen only in preview mode
function previewUrl() {
  const bw = previewing && $("wsBw").checked, sleep = previewing && $("wsSleep").checked;
  return `/api/preview.png?page=${page}&bw=${bw}&sleep=${sleep}&t=${Date.now()}`;
}

function refreshPreview() {
  if (!cfg) return;
  if (document.body.classList.contains("ws-on")) { $("layoutImg").dataset.page = page; $("layoutImg").src = previewUrl(); return; }
  $("deviceFrame").classList.toggle("landscape", cfg.device.orientation === "landscape");
  $("previewImg").src = `/api/preview.png?page=${page}&bw=${$("bw").checked}&sleep=${$("sleepPreview").checked}&t=${Date.now()}`;
}

// ---------- Step 3 / device detection ----------
function applyDetectedModel(devices) {
  const known = devices.find((d) => d.model);
  if (!known || (cfg.device.model && cfg.device.model !== "auto")) return;
  setModel(known.model);
  $("modelNote").textContent = T("connect.model_detected", { model: known.model_name });
  $("modelNote").classList.remove("hidden");
}

async function scanKobos() {
  try {
    const r = await api("/api/kobo");
    $("binaryWarn").classList.toggle("hidden", r.kobo_binary);
    $("staleWarn").classList.toggle("hidden", !(r.kobo_binary && r.kobo_binary_stale));
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    $("staleWarn").innerHTML = T("install.binary_stale", {
      path: esc(r.kobo_binary_path || ""),
      kobo: esc(r.kobo_binary_commit || "?"),
      tool: esc(r.setup_commit || "?"),
    });
    applyDetectedModel(r.devices);
    const list = $("devices");
    if (!r.devices.length) {
      list.replaceChildren(el("p", { class: "hint" }, T("install.none")));
      return;
    }
    list.replaceChildren(...r.devices.map((d) => {
      const configured = modelByKey(cfg.device.model);
      const mismatch = d.model && d.model !== cfg.device.model;
      // installed | pending | check (Kobo updated since the last start from the menu) | missing
      const nm = d.nickelmenu;
      const nmChip = el("span", { class: "status " + ({ installed: "ok", pending: "", check: "warn" }[nm] ?? "no") },
        T({ installed: "install.nm_found", pending: "install.nm_pending", check: "install.nm_check" }[nm] ?? "install.nm_missing"));
      const needsNm = (nm === "missing" || nm === "check") && d.firmware_supported;
      const explain = el("div", { class: "notice warn" });
      explain.innerHTML = T(nm === "check" ? "install.nm_check_explain" : "install.nm_explain");
      const forkNote = el("div", { class: "notice info" });
      forkNote.innerHTML = T("install.nm_fork_note", { version: d.nickelmenu_version || "" });
      const primary = needsNm
        ? el("button", { class: "btn primary", disabled: !r.kobo_binary, onclick: () => install(d.path, true) }, T("install.install_with_nm"))
        : el("button", { class: "btn primary", disabled: !r.kobo_binary, onclick: () => install(d.path, false, nm === "pending") }, T(d.installed ? "install.update" : "install.install"));
      return el("div", { class: "kobo" },
        el("div", { style: "flex:1;min-width:220px" },
          el("div", { class: "path" }, d.model_name || T("install.unknown_model")),
          el("div", { class: "meta" }, `${d.path} · ${T("install.firmware", { version: d.firmware || "?" })}`),
          el("div", { class: "row", style: "margin-top:6px;gap:6px" },
            nmChip,
            el("span", { class: "status" + (d.installed ? " ok" : "") }, T(d.installed ? "install.installed" : "install.not_installed"))),
          !d.firmware_supported ? el("div", { class: "notice err" }, T("install.firmware_unsupported", { version: d.firmware || "?" })) : null,
          nm === "missing" || nm === "check" ? explain : null,
          needsNm && d.nickelmenu_fork ? forkNote : null,
          mismatch ? el("div", { class: "notice warn row" },
            T("install.model_mismatch", { model: d.model_name, configured: configured ? configured.name : T("connect.model_auto") }),
            el("button", { class: "btn small", onclick: () => { setModel(d.model); scanKobos(); } }, T("install.use_model", { model: d.model_name }))) : null),
        d.has_config ? el("button", { class: "btn", onclick: () => importFrom(d.path) }, T("install.load_config")) : null,
        d.old_logs?.length ? el("button", { class: "btn", title: T("install.clean_logs_title"), onclick: () => cleanLogs(d) },
          T("install.clean_logs", { size: mb(d.old_logs.reduce((n, [, b]) => n + b, 0)) })) : null,
        el("button", { class: "btn", title: T("install.eject_title"), onclick: () => ejectKobo(d.path) }, T("install.eject")),
        primary);
    }));
  } catch (e) {
    $("devices").replaceChildren(el("div", { class: "notice err" }, e.message));
  }
}

async function install(path, withNickelMenu = false, nickelMenuPending = false) {
  const log = $("installLog");
  log.classList.remove("hidden");
  log.textContent = T("install.installing");
  const lines = [];
  const show = (entries) => {
    lines.push(...entries.map((l) => "✓ " + T("install.log." + l.key, l.args || {})));
    log.textContent = lines.join("\n");
  };
  try {
    await pushDraft(true);
    if (withNickelMenu) show((await api("/api/kobo/nickelmenu", { method: "POST", body: { path } })).log);
    show((await api("/api/kobo/install", { method: "POST", body: { path, menu_name: $("menuName").value } })).log);
    setDirty(false);
    if (withNickelMenu || nickelMenuPending) {
      lines.push("", T("install.restart_hint"));
      log.textContent = lines.join("\n");
    }
    $("finishRow")?.remove();
    log.after(el("div", { id: "finishRow", class: "row", style: "margin-top:12px;justify-content:flex-end" },
      // Installed and saved: nothing left to ask
      el("button", { class: "btn primary", onclick: () => (dirty ? quitSetup() : finishQuit(false)) }, T("install.finish"))));
    scanKobos();
  } catch (e) {
    lines.push("✕ " + e.message);
    log.textContent = lines.join("\n");
  }
}

const mb = (bytes) => (bytes / 1e6).toLocaleString(storage.get("uiLang") || "en", { maximumFractionDigits: 1 }) + " MB";

/// Delete the old logs on a Kobo, after saying which
async function cleanLogs(d) {
  const list = d.old_logs.map(([name, b]) => `• ${name} (${mb(b)})`).join("\n");
  if (!confirm(T("install.clean_logs_confirm", { list }))) return;
  const log = $("installLog");
  log.classList.remove("hidden");
  try {
    const r = await api("/api/kobo/clean-logs", { method: "POST", body: { path: d.path } });
    log.textContent = T("install.logs_cleaned", { size: mb(r.freed) });
  } catch (e) {
    log.textContent = "✕ " + e.message;
  }
  scanKobos();
}

/// Eject the Kobo so it can be unplugged safely
async function ejectKobo(path) {
  const log = $("installLog");
  try {
    await pushDraft(true);
    await api("/api/kobo/eject", { method: "POST", body: { path } });
    log.classList.remove("hidden");
    log.textContent = T("install.ejected");
  } catch (e) {
    log.classList.remove("hidden");
    log.textContent = "✕ " + e.message;
  }
  scanKobos();
}

async function importFrom(path) {
  if (!confirm(T("install.import_confirm"))) return;
  try {
    const imported = await api("/api/kobo/import", { method: "POST", body: { path } });
    page = 0;
    await replaceConfig(imported);
    $("installLog").classList.remove("hidden");
    $("installLog").textContent = T("install.imported", { path });
  } catch (e) { alert(e.message); }
}

// ---------- Boot ----------
/// Keep hand-edited values selectable in a fixed list of durations.
function selectValue(id, secs) {
  const v = String(secs);
  const sel = $(id);
  if (![...sel.options].some((o) => o.value === v)) sel.append(el("option", { value: v }, `${Math.round(secs / 60)} min`));
  return v;
}

/// Keep hand-edited timeouts (e.g. 90 s) selectable in the list.
function lightTimeoutValue() {
  const v = String(cfg.device.frontlight_timeout_secs || 0);
  const sel = $("lightTimeout");
  if (![...sel.options].some((o) => o.value === v)) sel.append(el("option", { value: v }, `${v} s`));
  return v;
}

/// The update interval in whole minutes (5 when not set)
function updateMinutes() {
  return Math.max(1, Math.round((cfg.home_assistant.update_interval_secs || 300) / 60));
}

function showBatteryOpts() {
  $("reportBattery").checked = !!cfg.home_assistant.report_battery;
  $("batteryOpts").classList.toggle("hidden", !cfg.home_assistant.report_battery);
}

function bindAllFields() {
  for (const [id, v] of [["haUrl", cfg.home_assistant.url], ["haToken", cfg.home_assistant.token], ["orientation", cfg.device.orientation],
    ["themeMode", cfg.theme.mode], ["accent", cfg.theme.accent_color], ["timeFormat", cfg.theme.time_format],
    ["utcOffset", cfg.theme.utc_offset || ""], ["refresh", updateMinutes()], ["language", cfg.theme.language],
    ["model", cfg.device.model || "auto"], ["lightTimeout", lightTimeoutValue()],
    ["sleepAfter", selectValue("sleepAfter", cfg.device.sleep_after_secs || 0)],
    ["sleepWake", selectValue("sleepWake", cfg.device.sleep_wake_secs || 900)],
    ["keepAwake", ["auto", "show", "hide"].includes(cfg.device.keep_awake_button) ? cfg.device.keep_awake_button : "auto"],
    ["batteryEntity", cfg.home_assistant.battery_entity || "sensor.kobo_battery"]]) {
    $(id).value = v ?? "";
  }
  showBatteryOpts();
}

async function boot() {
  const s = await api("/api/state");
  const pinned = s.config?.theme?.utc_offset;
  cfg = dropAutomaticOffset(s.config);
  icons = s.icons;
  models = s.models;
  languages = s.languages;
  hidden = s.hidden || [];
  layouts = s.layouts || [];

  // ?lang=xx picks the interface language directly (handy for shared links).
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl && languages.some(([c]) => c === fromUrl)) storage.set("uiLang", fromUrl);
  const uiLang = storage.get("uiLang");
  await loadStrings(uiLang || browserLang());
  $("uiLang").replaceChildren(...languages.map(([code, name]) => el("option", { value: code }, name)));
  $("uiLang").value = uiLang || browserLang();
  $("uiLang").onchange = () => setUiLang($("uiLang").value);
  applyStatic();

  $("language").replaceChildren(...languages.map(([code, name]) => el("option", { value: code }, `${name} (${code})`)));
  renderModelSelect();
  renderCardTypes();
  $("menuName").value = s.menu_name;
  bindConnect();
  bindAllFields();
  // Hand the dropped automatic offset to the setup tool's copy as well, as the
  // old automatic fill did, so saving and installing write the config without it.
  if (pinned && !cfg.theme.utc_offset) sync();
  updateTokenButton();
  applyDetectedModel(s.devices || []);

  document.querySelectorAll("nav.steps button").forEach((b) => (b.onclick = () => setStep(b.dataset.step)));
  $("lovelaceImport").onclick = importLovelace;
  $("lovelaceReload").onclick = () => loadDashboards(true);
  $("lovelaceClose").onclick = () => $("lovelaceDialog").close();
  const menu = $("addPageMenu");
  const closeMenu = () => menu.classList.add("hidden");
  $("addPageBtn").onclick = (ev) => { ev.stopPropagation(); menu.classList.toggle("hidden"); menu.querySelector("button")?.focus(); };
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".menu-wrap")) closeMenu(); closeCardMenu(); closeIconPicker(); });
  document.addEventListener("contextmenu", (ev) => {
    if (!ev.target.closest(".grid-stack-item, .shelf-item, .palette-item, .ws-pages .tab")) closeCardMenu();
  });
  window.addEventListener("blur", closeCardMenu);
  $("inspector").addEventListener("scroll", closeIconPicker);
  $("addBlankPage").onclick = () => { closeMenu(); addPage(); };
  menu.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => { closeMenu(); addPresetPage(b.dataset.preset); }));
  $("openLovelace").onclick = () => {
    closeMenu();
    $("lovelaceResult").replaceChildren();
    $("lovelaceDialog").showModal();
    loadDashboards();
  };
  $("modeDesign").onclick = () => setPreviewing(false);
  $("modePreview").onclick = () => setPreviewing(true);
  $("wsBw").onchange = refreshPreview;
  $("previewReset").onclick = async () => {
    await api("/api/preview/reset", { method: "POST" }).catch(() => {});
    $("layoutStage").classList.remove("dim");
    refreshPreview();
  };
  $("wsSleep").onchange = refreshPreview;
  // A click on the canvas outside the cards selects the page
  $("canvasWrap").addEventListener("pointerdown", (ev) => {
    if (previewing) { if (ev.target.closest("#layoutStage")) previewTap(ev); return; }
    if (ev.target.closest(".grid-stack-item")) return;
    // The page tabs drawn in the header switch pages, as on the Kobo
    const tab = tabAt(ev.clientX, ev.clientY);
    if (tab != null) {
      if (tab !== page) showPage(tab);
      else if (!previewing) { deselectCard(); $("inspector").querySelector("input")?.focus(); }
      return;
    }
    if (!previewing) deselectCard();
  });
  $("gridCols").onchange = resizeGrid;
  $("gridRows").onchange = resizeGrid;
  $("layoutCompact").onclick = () => gs && gs.compact();
  $("layoutAuto").onclick = autoLayout;
  let resizeTimer = null;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { fitTop(); renderLayout(); }, 150); });
  $("bw").onchange = refreshPreview;
  $("sleepPreview").onchange = refreshPreview;
  $("reloadPreview").onclick = refreshPreview;
  $("rescan").onclick = scanKobos;
  $("quitBtn").onclick = quitSetup;
  $("saveStatus").title = T("app.config_file", { file: s.config_path });
  lastSnapshot = snapshot();
  setDirty(!!s.dirty);
  updateUndoButtons();
  $("saveBtn").onclick = () => saveNow().catch((e) => alert(e.message));
  $("undoBtn").onclick = undo;
  $("redoBtn").onclick = redo;
  $("historyBtn").onclick = () => openHistory().catch((e) => alert(e.message));
  $("historyClose").onclick = () => $("historyDialog").close();
  window.addEventListener("beforeunload", (ev) => {
    if (dirty && !quitting) { ev.preventDefault(); ev.returnValue = ""; }
  });
  document.addEventListener("keydown", (ev) => {
    const mod = ev.metaKey || ev.ctrlKey;
    const typing = ev.target.closest("textarea, select, input:not([type=checkbox]):not([type=radio]):not([type=color])");
    if (!mod && !typing && document.body.classList.contains("ws-on") && !document.querySelector("dialog[open]")) {
      if (ev.key === "Escape") {
        if ($("ctxMenu") || iconPop || !menu.classList.contains("hidden")) { closeCardMenu(); closeIconPicker(); closeMenu(); return; }
        if (previewing) setPreviewing(false); else deselectCard();
        return;
      }
      if (ev.key.toLowerCase() === "p" && !ev.altKey) { setPreviewing(!previewing); return; }
      if ((ev.key === "Delete" || ev.key === "Backspace") && openCard != null && !previewing) { ev.preventDefault(); deleteCard(openCard); return; }
    }
    if (mod && !typing && document.body.classList.contains("ws-on") && !previewing) {
      const k = ev.key.toLowerCase();
      if (k === "d" && openCard != null) { ev.preventDefault(); duplicateCard(openCard); return; }
      if (k === "c" && openCard != null && !getSelection().toString()) { clipboard = JSON.stringify(cfg.pages[page].cards[openCard]); return; }
      if (k === "v" && clipboard) { ev.preventDefault(); pasteCard(); return; }
    }
    if (!mod) return;
    const key = ev.key.toLowerCase();
    if (key === "s") { ev.preventDefault(); if (dirty) saveNow().catch((e) => alert(e.message)); return; }
    // Inside text fields, leave Ctrl+Z to the browser's own text undo.
    if (ev.target.closest("input, textarea")) return;
    if (key === "z" && !ev.shiftKey) { ev.preventDefault(); undo(); }
    else if ((key === "z" && ev.shiftKey) || key === "y") { ev.preventDefault(); redo(); }
  });

  renderPageChips();
  refreshPreview();
  setInterval(refreshPreview, 30000);
  if (cfg.home_assistant.token) loadEntities(false);
  const hash = location.hash.slice(1);
  if (["connect", "design", "install"].includes(hash)) setStep(hash);
  else if (hash === "token-help") { setStep("connect"); openTokenHelp(); }
  else if (cfg.pages.length && cfg.home_assistant.token) setStep("design");
  ensureFont();
  checkForUpdate();
  if (!uiLang) showSplash();
}

boot().catch((e) => { document.body.prepend(el("div", { class: "notice err" }, T("app.load_failed", { error: e.message }))); });
</script>
</body>
</html>
